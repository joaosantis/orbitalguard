version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: dimdim-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: dimdim_db
      MYSQL_USER: dimdim
      MYSQL_PASSWORD: dimdim123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "dimdim", "-pdimdim123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - dimdim-net

  api:
    build: ./dimdim-api
    container_name: dimdim-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/dimdim_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: dimdim
      SPRING_DATASOURCE_PASSWORD: dimdim123
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - dimdim-net
    restart: on-failure

volumes:
  mysql_data:

networks:
  dimdim-net:
    driver: bridge
