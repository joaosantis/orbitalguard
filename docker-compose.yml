services:

  # ── Container do Banco de Dados ──────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: orbitalguard-mysql-rm555287
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: orbitalguard_db
      MYSQL_USER: orbital
      MYSQL_PASSWORD: orbital123
    ports:
      - "3306:3306"
    volumes:
      - orbitalguard_data:/var/lib/mysql
      - ./orbitalguard-mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "orbital", "-porbital123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - orbitalguard-net

  # ── Container da Aplicação ────────────────────────────────────────────────────
  api:
    build: ./orbitalguard-api
    container_name: orbitalguard-api-rm555287
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/orbitalguard_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true
      SPRING_DATASOURCE_USERNAME: orbital
      SPRING_DATASOURCE_PASSWORD: orbital123
      APP_ENV: production
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - orbitalguard-net
    restart: on-failure

# ── Volume nomeado para persistência ─────────────────────────────────────────
volumes:
  orbitalguard_data:

# ── Rede compartilhada entre os containers ───────────────────────────────────
networks:
  orbitalguard-net:
    driver: bridge
