name: Build e Push Docker para ACR

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'orbitalguard-api/**'
      - 'dockerfiles/**'

env:
  ACR_NAME: orbitalguardrm555287
  ACR_LOGIN_SERVER: orbitalguardrm555287.azurecr.io
  API_IMAGE: orbitalguard-api
  IMAGE_TAG: v1

jobs:
  build-push:
    name: Build e Push imagem API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build JAR com Maven
        run: mvn package -DskipTests -f orbitalguard-api/pom.xml -q

      - name: Login no ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build e Push imagem API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: dockerfiles/Dockerfile
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/${{ env.API_IMAGE }}:${{ env.IMAGE_TAG }}
