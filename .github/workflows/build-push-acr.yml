name: Build e Push Docker para ACR

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'orbitalguard-api/**'
      - 'dockerfiles/**'

env:
  ACR_NAME: orbitalguardrm555287
  ACR_LOGIN_SERVER: orbitalguardrm555287.azurecr.io
  API_IMAGE: orbitalguard-api
  IMAGE_TAG: v1

jobs:
  build-push:
    name: Build e Push imagem API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build JAR com Maven
        run: mvn package -DskipTests -f orbitalguard-api/pom.xml -q

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login no ACR via token Azure AD
        run: |
          ACR_TOKEN=$(az acr login --name ${{ env.ACR_NAME }} --expose-token --output tsv --query accessToken)
          echo "$ACR_TOKEN" | docker login ${{ env.ACR_LOGIN_SERVER }} \
            -u 00000000-0000-0000-0000-000000000000 --password-stdin

      - name: Build e Push imagem API
        run: |
          docker build \
            -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.API_IMAGE }}:${{ env.IMAGE_TAG }} \
            -f dockerfiles/Dockerfile .
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.API_IMAGE }}:${{ env.IMAGE_TAG }}
