trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  JAVA_VERSION: '17'
  ARTIFACT_NAME: 'orbitalguard'
  IMAGE_TAG: 'v$(Build.BuildId)'
  RM: 'rm555287'

stages:
  - stage: CI
    displayName: 'CI - Build e Testes'
    jobs:
      - job: Build
        displayName: 'Instalar, Compilar, Testar e Empacotar'
        steps:
          - task: JavaToolInstaller@0
            displayName: 'Configurar Java 17'
            inputs:
              versionSpec: '17'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'

          - task: Maven@4
            displayName: 'Maven - Compilar e executar testes'
            inputs:
              mavenPomFile: 'orbitalguard-api/pom.xml'
              goals: 'clean package'
              options: ''
              publishJUnitResults: true
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              testRunTitle: 'OrbitalGuard - Testes Automatizados'
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.17'
              mavenVersionOption: 'Default'

          - task: CopyFiles@2
            displayName: 'Preparar artefato JAR'
            inputs:
              SourceFolder: '$(System.DefaultWorkingDirectory)'
              Contents: '**/target/*.jar'
              TargetFolder: '$(Build.ArtifactStagingDirectory)/$(ARTIFACT_NAME)'

          - task: PublishPipelineArtifact@1
            displayName: 'Publicar artefato orbitalguard'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/$(ARTIFACT_NAME)'
              artifact: '$(ARTIFACT_NAME)'
              publishLocation: 'pipeline'

  - stage: CD
    displayName: 'CD - Build Docker e Deploy no ACI'
    dependsOn: CI
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: Deploy
        displayName: 'Build Docker + Push ACR + Reiniciar ACI'
        environment: 'orbitalguard-producao'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - download: current
                  artifact: '$(ARTIFACT_NAME)'

                - task: AzureCLI@2
                  displayName: 'Build imagem API e push para ACR'
                  inputs:
                    azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      acrName="orbitalguard$(RM)"
                      az acr login --name $acrName

                      docker build \
                        -t $acrName.azurecr.io/orbitalguard-api:$(IMAGE_TAG) \
                        -f dockerfiles/Dockerfile .

                      docker push $acrName.azurecr.io/orbitalguard-api:$(IMAGE_TAG)

                      docker build \
                        -t $acrName.azurecr.io/orbitalguard-mysql:$(IMAGE_TAG) \
                        -f dockerfiles/Dockerfile.mysql .

                      docker push $acrName.azurecr.io/orbitalguard-mysql:$(IMAGE_TAG)

                      echo "Imagens publicadas no ACR com tag: $(IMAGE_TAG)"

                - task: AzureCLI@2
                  displayName: 'Reiniciar container API no ACI'
                  inputs:
                    azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      az container restart \
                        --resource-group "rg-orbitalguard-$(RM)" \
                        --name "api-orbitalguard" \
                        --output table || echo "Container nao encontrado - execute os scripts de provisionamento primeiro"
